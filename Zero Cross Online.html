.c{position:absolute;width:15%;aspect-ratio:1;transform:translate(-50%,-50%);border:0;border-radius:50%;background:transparent;font-size:13cqw;font-weight:900;line-height:1;padding:0;color:#fff;font-family:"Comic Sans MS","Chalkboard SE",system-ui,sans-serif;text-shadow:0 0 6px #000,0 2px 0 #000,2px 0 0 #000,-2px 0 0 #000}
.c.X{color:#ffe14d}.c.O{color:#ff5c8a}
.c.win{animation:p .6s infinite alternate;background:#ffffff55}
@keyframes p{to{transform:translate(-50%,-50%) scale(1.25)}}
.score{display:flex;gap:10px;margin-top:10px}
.score div{background:var(--card);padding:8px 14px;border-radius:12px;text-align:center;font-weight:700;min-width:84px}
.score span{display:block;font-size:1.4rem}
.err{color:#d33;font-weight:600;text-align:center;min-height:1.2em}
</style></head><body>
<h1>✕ Zero Cross Online ◯</h1>
<div id="menu" class="card">
 <button class="ui p" id="bHost">🌐 Create online room</button>
 <div class="row"><input id="inCode" maxlength="5" placeholder="CODE" aria-label="Room code"><button class="ui" id="bJoin">Join</button></div>
 <button class="ui" id="bCpu">🤖 Play vs Computer</button>
 <button class="ui" id="bLocal">👥 2 Players, same phone</button>
 <div class="err" id="err"></div>
</div>
<div id="game" hidden style="width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center">
 <div id="codewrap" hidden style="text-align:center"><div style="font-size:.85rem">Share this code with your friend</div><div id="codebox"></div><button class="ui" id="bCopy" style="padding:6px 12px">Copy invite link</button></div>
 <div id="status"></div>
 <div id="board"></div>
 <div class="score"><div>✕<span id="sx">0</span></div><div>Draw<span id="sd">0</span></div><div>◯<span id="so">0</span></div></div>
 <div class="row" style="margin-top:10px;width:100%"><button class="ui" id="bNew">New Round</button><button class="ui" id="bLeave">Leave</button></div>
</div>
<script>
const P=[[240,300],[590,265],[900,235],[270,616],[625,553],[945,500],[300,900],[690,880],[1000,850]];
const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const $=id=>document.getElementById(id),sym=t=>t=='X'?'✕':'◯';
let G,mode,me='X',net=null,code='',guestOK=false,got=false,hostGone=false,timer=0;
const cells=P.map((p,i)=>{const e=document.createElement('button');e.className='c';e.setAttribute('aria-label','cell '+(i+1));
e.style.left=p[0]/1576*100+'%';e.style.top=p[1]/2100*100+'%';e.onclick=()=>tap(i);$('board').appendChild(e);return e});
const fresh=s=>({b:Array(9).fill(''),turn:'X',over:false,win:null,w:null,s:s||{X:0,O:0,D:0}});
const win=b=>L.find(l=>b[l[0]]&&b[l[0]]==b[l[1]]&&b[l[1]]==b[l[2]])||null;
const bc=()=>{if(net&&mode=='host')net.send({t:'state',G})};
function status(){const on=mode=='host'||mode=='guest';
 if(mode=='host'&&!guestOK)return 'Waiting for a friend to join…';
 if(mode=='guest'&&hostGone)return 'Host left the room';
 if(mode=='guest'&&!got)return 'Connecting…';
 if(G.over){if(G.w=='D')return "It's a draw 🤝";if(on)return G.w==me?'You win! 🎉':'Friend wins 😅';if(mode=='cpu')return G.w=='X'?'You win! 🎉':'Computer wins 🤖';return sym(G.w)+' wins! 🎉'}
 if(on)return G.turn==me?'Your turn ('+sym(me)+')':"Friend's turn…";
 if(mode=='cpu')return G.turn=='X'?'Your turn: ✕':'Computer thinking… ◯';
 return 'Turn: '+sym(G.turn)}
function render(){cells.forEach((c,i)=>{const v=G.b[i];c.textContent=v?sym(v):'';c.className='c'+(v?' '+v:'')+(G.win&&G.win.includes(i)?' win':'')});
 $('sx').textContent=G.s.X;$('so').textContent=G.s.O;$('sd').textContent=G.s.D;$('status').textContent=status();
 $('bNew').hidden=false}
function place(i){G.b[i]=G.turn;const w=win(G.b);
 if(w){G.over=true;G.win=w;G.w=G.turn;G.s[G.turn]++}else if(G.b.every(x=>x)){G.over=true;G.w='D';G.s.D++}else G.turn=G.turn=='X'?'O':'X';
 render();bc()}
function tap(i){if(!G||G.over||G.b[i])return;
 if(mode=='guest'){if(got&&G.turn=='O')net.send({t:'move',i});return}
 if(mode=='host'){if(guestOK&&G.turn=='X')place(i);return}
 if(mode=='cpu'&&G.turn!='X')return;
 place(i);if(mode=='cpu'&&!G.over)setTimeout(cpu,500)}
function mm(b,t){const w=win(b);if(w)return b[w[0]]=='O'?1:-1;if(b.every(x=>x))return 0;
 let best=t=='O'?-2:2;for(let i=0;i<9;i++)if(!b[i]){b[i]=t;const s=mm(b,t=='O'?'X':'O');b[i]='';best=t=='O'?Math.max(best,s):Math.min(best,s)}return best}
function cpu(){if(G.over||mode!='cpu')return;const e=G.b.map((x,i)=>x?-1:i).filter(i=>i>=0);let m;
 if(Math.random()<.25)m=e[Math.floor(Math.random()*e.length)];else{let bs=-2;for(const i of e){G.b[i]='O';const s=mm(G.b,'X');G.b[i]='';if(s>bs){bs=s;m=i}}}
 place(m)}
function newRound(){if(mode=='guest'){if(got)net.send({t:'again'});return}G=fresh(G.s);render();bc();if(mode=='cpu'||mode=='local')return}
function onMsg(m){if(!m||typeof m!='object')return;
 if(mode=='host'){
  if(m.t=='join'){guestOK=true;render();bc()}
  else if(!guestOK)return;
  else if(m.t=='move'&&G.turn=='O'&&!G.over&&Number.isInteger(m.i)&&m.i>=0&&m.i<9&&!G.b[m.i])place(m.i);
  else if(m.t=='again')newRound()}
 else if(mode=='guest'&&m.t=='state'&&m.G&&Array.isArray(m.G.b)){got=true;hostGone=false;clearTimeout(timer);G=m.G;render()}}
function onLeft(){if(mode=='host'){guestOK=false;G=fresh(G.s);render()}else if(mode=='guest'){hostGone=true;render()}}
async function connect(c,host){
 const rm=window.claude&&claude.use?await claude.use('room'):null;
 if(rm){try{const r=await rm.join('zc-'+c.toLowerCase());let n=0;const seen={};
  r.onPeers(ch=>{[...ch.joined,...ch.updated].forEach(p=>{if(p.isMe)return;const q=p.presence;if(!q||q.n==null||!q.m||seen[p.peer]===q.n)return;seen[p.peer]=q.n;onMsg(q.m)});ch.left.forEach(p=>{if(!p.isMe)onLeft()})});
  return{send:m=>{n++;r.presence({n,m})},close:()=>r.leave()}}catch(e){}}
 if(!window.Peer)return null;
 return new Promise(res=>{let conn,done=false;const fin=v=>{if(!done){done=true;res(v)}};
  const nt={send:m=>{if(conn&&conn.open)conn.send(m)},close:()=>{try{p.destroy()}catch(e){}}};
  const hook=cn=>{conn=cn;cn.on('data',onMsg);cn.on('close',onLeft)};
  const p=host?new Peer('zcross-'+c):new Peer();
  p.on('error',()=>fin(null));
  if(host){p.on('open',()=>fin(nt));p.on('connection',hook)}
  else p.on('open',()=>{const cn=p.connect('zcross-'+c);hook(cn);cn.on('open',()=>{fin(nt);nt.send({t:'join'})})});
  setTimeout(()=>fin(null),9000)})}
const genCode=()=>Array.from({length:5},()=>'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*31)]).join('');
function show(g){$('menu').hidden=g;$('game').hidden=!g;$('codewrap').hidden=!(g&&mode=='host')}
function fail(t){leave();$('err').textContent=t}
async function startOnline(host){$('err').textContent='';const c=host?genCode():$('inCode').value.trim().toUpperCase();
 if(!host&&c.length<5){$('err').textContent='Enter the 5-letter room code.';return}
 mode=host?'host':'guest';me=host?'X':'O';code=c;guestOK=false;got=false;hostGone=false;G=fresh();$('codebox').textContent=c;show(true);render();
 net=await connect(c,host);
 if(!net)return fail('Could not connect online. Open the page on a device where online play is available, then try again.');
 if(host)bc();else timer=setTimeout(()=>{if(!got)fail("Couldn't find that room. Check the code and make sure your friend created it first.")},8000)}
function startLocal(m){mode=m;me='X';G=fresh();show(true);render()}
function leave(){clearTimeout(timer);if(net){try{net.close()}catch(e){}}net=null;mode=null;show(false)}
$('bHost').onclick=()=>startOnline(true);$('bJoin').onclick=()=>startOnline(false);
$('bCpu').onclick=()=>startLocal('cpu');$('bLocal').onclick=()=>startLocal('local');
$('bNew').onclick=newRound;$('bLeave').onclick=leave;
$('bCopy').onclick=async()=>{const u=location.href.split('#')[0]+'#'+code;try{await navigator.clipboard.writeText(u);$('bCopy').textContent='Invite link copied ✓'}catch(e){$('bCopy').textContent=u}};
if(/^#[A-Za-z0-9]{5}$/.test(location.hash)){$('inCode').value=location.hash.slice(1).toUpperCase();$('err').textContent='Tap Join to enter the room.'}
$('inCode').addEventListener('keydown',e=>{if(e.key=='Enter')startOnline(false)});
</script></body></html>
